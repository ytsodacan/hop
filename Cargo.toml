[package]
name = "hop"
version = "0.2.0"
edition = "2021"
description = "A file explorer you can type at: path fragments, tabs, tiles, folder sizes and a built-in editor, in about 45 MB of RAM"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["file-manager", "explorer", "slint"]
categories = ["filesystem", "gui"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-winit-030", "renderer-software", "accessibility", "image-default-formats"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
opener = "0.9"
dirs = "7"
png = "0.18"
sha2 = "0.11"
imagesize = "0.15"
fancy-regex = "0.20.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }
clipboard-win = "5.4.3"

[target.'cfg(not(windows))'.dependencies]
arboard = "3"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.fast]
# quick test builds: optimised, but no LTO so it links in seconds
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 2

[profile.dev]
opt-level = 1
